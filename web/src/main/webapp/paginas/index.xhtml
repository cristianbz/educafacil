<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/WEB-INF/templates/templateprincipal.xhtml">

    <ui:define name="contenido">
        <f:event listener="#{backingLogin.validarSesion()}" type="preRenderView" />
        <f:event listener="#{backingLogin.redirigirInicio}" type="preRenderView" />

        <!-- Contenido de respaldo mientras se redirige (solo por si acaso) -->
        <h:form id="formIndex" prependId="false">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;
                        min-height: 60vh; text-align: center; padding: 2rem;">
                <div style="width: 80px; height: 80px; border-radius: 50%;
                            background: #eff6ff; display: flex; align-items: center;
                            justify-content: center; margin-bottom: 1.5rem;">
                    <i class="pi pi-spin pi-spinner" style="font-size: 2.5rem; color: var(--primary-color);"></i>
                </div>
                <h3 style="font-weight: 700; color: var(--text-main); margin: 0 0 0.5rem 0;">
                    Redirigiendo al panel principal...
                </h3>
                <p style="color: var(--text-muted); max-width: 400px;">
                    Si no eres redirigido automáticamente,
                    <p:commandLink value="haz clic aquí"
                                   action="/paginas/inicio?faces-redirect=true"
                                   process="@this"
                                   style="font-weight: 600; color: var(--primary-color);" />
                </p>
            </div>
        </h:form>

    </ui:define>

</ui:composition>
</html>
