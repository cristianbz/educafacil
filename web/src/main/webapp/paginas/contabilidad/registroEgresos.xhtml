<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="jakarta.faces.facelets" xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	xmlns:comp="jakarta.faces.composite/componentes"
	xmlns:val="jakarta.faces.composite/componentes"
	xmlns:p="http://primefaces.org/ui">

<!-- 
		Replace path to template, title, header and body
		with actual data.
	 -->
<ui:composition template="/WEB-INF/templates/templateprincipal.xhtml">
	<ui:define name="contenido">
		<f:event listener="#{backingLogin.validarSesion()}"
			type="preRenderView" />
		<h:form>
			<p:growl id="growl" life="3000" showDetail="true" />


			<p:dialog widgetVar="dlgBuscaEgresos" closable="true"
				header="#{titulos['buscaEgresos']}" responsive="true" width="400">
				<p:outputPanel id="busqueda">
					<p:scrollPanel mode="native" style="max-height:350px;">
						<div class="ui-fluid p-formgrid p-grid">
							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 1rem;">
								<p:outputLabel value="#{etiquetas['fechaInicio']}:*"
									for="fechaUno"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:datePicker value="#{backingEgresos.beanEgresos.fechaInicial}"
									pattern="yyyy-MM-dd" tabindex="3" monthNavigator="true"
									yearNavigator="true" id="fechaUno" locale="es_ES"
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="fechaUno" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 1rem;">
								<p:outputLabel value="#{etiquetas['fechaFin']}:*" for="fechaDos"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:datePicker value="#{backingEgresos.beanEgresos.fechaFinal}"
									pattern="yyyy-MM-dd" tabindex="4" monthNavigator="true"
									yearNavigator="true" id="fechaDos" locale="es_ES"
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="fechaDos" />
							</div>
						</div>
					</p:scrollPanel>
				</p:outputPanel>
				<div
					style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.75rem;">
					<p:commandButton value="#{botones['aceptar']}" tabindex="1"
						update="growl listaEgresosRegistrados busqueda"
						actionListener="#{backingEgresos.buscarEgresos()}"
						process="@this busqueda" onstart="showLoading();"
						oncomplete="hideLoading();" icon="#{botones['icono.select']}"
						partialSubmit="true" />
					<p:commandButton value="#{botones['cancelar']}" tabindex="2"
						icon="#{botones['icono.cancelar']}" process="@this"
						partialSubmit="true" oncomplete="PF('dlgBuscaEgresos').hide()" />
				</div>
			</p:dialog>


			<p:dialog widgetVar="dlgRegProveedor" closable="true"
				header="#{titulos['registroProveedor']}" responsive="true"
				width="450">
				<p:outputPanel id="proveedor">
					<p:scrollPanel mode="native" style="max-height:350px;">
						<div class="ui-fluid p-formgrid p-grid">
							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['ruc']}:*"
									for="nuevoProveedor"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputText id="nuevoProveedor"
									onkeypress="if (event.keyCode == 13) { return false; }"
									tabindex="1"
									value="#{backingEgresos.beanEgresos.nuevoProveedor.provRuc}"
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="nuevoProveedor" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['proveedor']}:*"
									for="nuevoNombreProveedor"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputText id="nuevoNombreProveedor" tabindex="2"
									value="#{backingEgresos.beanEgresos.nuevoProveedor.provNombre}"
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="nuevoNombreProveedor" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['direccion']}:*"
									for="nuevoDireccionProveedor"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputText id="nuevoDireccionProveedor" tabindex="3"
									value="#{backingEgresos.beanEgresos.nuevoProveedor.provDireccion}"
									maxlength="50" required="true"
									requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="nuevoDireccionProveedor" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['telefono']}:*"
									for="nuevoTelefonoProveedor"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputText id="nuevoTelefonoProveedor"
									onkeypress="if( (event.which &lt; 48 || event.which &gt; 57) ) return false;"
									tabindex="4"
									value="#{backingEgresos.beanEgresos.nuevoProveedor.provTelefono}"
									maxlength="10" required="true"
									requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="nuevoTelefonoProveedor" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['correo']}:*"
									for="nuevoCorreoProveedor"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputText id="nuevoCorreoProveedor" tabindex="5"
									value="#{backingEgresos.beanEgresos.nuevoProveedor.provCorreo}"
									maxlength="100" required="true"
									requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;">
									<p:ajax event="blur" process="@this" />
									<f:validateRegex
										pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
								</p:inputText>
								<p:message for="nuevoCorreoProveedor" />
							</div>

						</div>
					</p:scrollPanel>
				</p:outputPanel>
				<div
					style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.75rem;">
					<p:commandButton value="#{botones['aceptar']}" tabindex="6"
						update="growl registroEgresos proveedor"
						actionListener="#{backingEgresos.registrarProveedor()}"
						process="@this proveedor" onstart="showLoading();"
						oncomplete="hideLoading();" icon="#{botones['icono.select']}"
						partialSubmit="true" />
					<p:commandButton value="#{botones['cancelar']}" tabindex="7"
						icon="#{botones['icono.cancelar']}" process="@this"
						partialSubmit="true" oncomplete="PF('dlgRegProveedor').hide()" />
				</div>
			</p:dialog>

			<p:dialog widgetVar="dlgRegEgreso" modal="true" closable="false"
				header="#{titulos['infoEgresos']}" responsive="true"
				style="width: 92vw; max-width: 500px;">

				<p:scrollPanel mode="native" style="max-height: min(65vh, 500px);">
					<p:outputPanel id="registroEgresos">
						<div class="ui-fluid p-formgrid p-grid"
							style="padding: 0.5rem 0.25rem;">
							<div class="p-field p-col-12 p-md-6"
								style="margin-bottom: 0.5rem;">
								<p:outputLabel value="#{etiquetas['fecha']}:"
									style="font-weight: 600;" />
							</div>
							<div class="p-field p-col-12 p-md-6"
								style="margin-bottom: 0.5rem;">
								<p:outputLabel
									value="#{backingEgresos.beanEgresos.egreso.egreFecha}"
									id="idegrfecha">
									<f:convertDateTime for="idegrfecha" pattern="yyyy-MM-dd" />
								</p:outputLabel>
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['numeroFactura']}:"
									for="numfactura"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputText id="numfactura"
									value="#{backingEgresos.beanEgresos.egreso.egreNumFactura}"
									maxlength="20" tabindex="1" style="width: 100%;" />
							</div>

							<div class="p-field p-col-10 p-md-10"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['proveedor']}:" for="idprov"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:selectOneMenu id="idprov" converter="selectOneMenuConverter"
									tabindex="2" filterMatchMode="contains" filter="true"
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									style="width:100%;"
									value="#{backingEgresos.beanEgresos.proveedorSeleccionado}">
									<f:selectItems
										value="#{backingEgresos.beanEgresos.listaProveedores}"
										var="prov" itemLabel="#{prov.provNombre}" itemValue="#{prov}"
										required="true"
										requiredMessage="#{mensajes['campoRequerido']}" />
								</p:selectOneMenu>
							</div>

							<div class="p-field p-col-2 p-md-2"
								style="margin-bottom: 0.85rem; display: flex; align-items: flex-end;">
								<p:commandButton icon="#{botones['icono.agregar']}"
									title="#{tooltip['registraProveedor']}" process="@this"
									actionListener="#{backingEgresos.nuevoProveedor()}"
									update="proveedor" resetValues="true" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['egreso']}:" for="idegreso"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:selectOneMenu id="idegreso"
									converter="selectOneMenuConverter" tabindex="3"
									filterMatchMode="contains" filter="true" required="true"
									requiredMessage="#{mensajes['campoRequerido']}"
									style="width:100%;"
									value="#{backingEgresos.beanEgresos.egresoSeleccionado}">
									<f:selectItems
										value="#{backingEgresos.beanEgresos.listaTipoEgreso}"
										var="egre" itemLabel="#{egre.cataDescripcion}"
										itemValue="#{egre}" required="true"
										requiredMessage="#{mensajes['campoRequerido']}" />
								</p:selectOneMenu>
								<p:message for="idegreso" />
							</div>

							<div class="p-field p-col-12 p-md-12"
								style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['valor']}:" for="valoregreso"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputNumber id="valoregreso"
									value="#{backingEgresos.beanEgresos.egreso.egreValor}"
									tabindex="4" required="true"
									requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%;" />
								<p:message for="valoregreso" />
							</div>

							<div class="p-field p-col-12 p-md-12">
								<p:outputLabel value="#{etiquetas['detalleEgreso']}:"
									for="detalleegreso"
									style="display: block; font-weight: 600; margin-bottom: 0.35rem;" />
								<p:inputTextarea id="detalleegreso"
									value="#{backingEgresos.beanEgresos.egreso.egreDetalle}"
									tabindex="5" maxlength="200" required="true"
									requiredMessage="#{mensajes['campoRequerido']}"
									style="width: 100%; resize: none;" />
								<p:message for="detalleegreso" />
							</div>
						</div>
					</p:outputPanel>
				</p:scrollPanel>

				<!-- Footer alineado con Jerarquía UI y flexbox adaptativo -->
				<f:facet name="footer">
					<div
						style="display: flex; justify-content: flex-end; align-items: center; gap: 0.75rem; padding: 0.5rem 0.25rem 0.25rem 0.25rem;">
						<p:commandButton value="#{botones['cancelar']}" tabindex="7"
							icon="#{botones['icono.cancelar']}" process="@this"
							partialSubmit="true" oncomplete="PF('dlgRegEgreso').hide()"
							styleClass="ui-button-outlined ui-button-secondary" />

						<p:commandButton value="#{botones['aceptar']}" tabindex="6"
							update="growl tblegresos registroEgresos"
							actionListener="#{backingEgresos.registrarEgreso()}"
							process="@this registroEgresos tblegresos"
							onstart="showLoading();"
							oncomplete="hideLoading(); if (!args.validationFailed) PF('confirmEmitirRetencion').show();"
							icon="#{botones['icono.select']}" partialSubmit="true" />
					</div>
				</f:facet>
			</p:dialog>

			<!-- Diálogo de Confirmación para Emitir Retención -->
			<p:confirmDialog widgetVar="confirmEmitirRetencion" showEffect="fade"
				width="450" header="Egreso Registrado"
				message="El egreso ha sido guardado exitosamente. ¿Desea emitir el comprobante de retención ahora?"
				severity="info" appendTo="@(body)">
				<div class="p-d-flex p-jc-end" style="gap: 0.5rem;">
					<p:commandButton value="Sí, Emitir Ahora" icon="pi pi-send"
						actionListener="#{backingRetencion.prepararNuevaRetencion(backingEgresos.beanEgresos.egreso)}"
						process="@this"
						oncomplete="PF('confirmEmitirRetencion').hide(); PF('dlgNuevaRetencion').show();"
						update=":formRetenciones" styleClass="ui-button-success" />
					<p:commandButton value="No, Después" type="button"
						styleClass="ui-button-secondary ui-button-flat"
						onclick="PF('confirmEmitirRetencion').hide()" />
				</div>
			</p:confirmDialog>

			<p:breadCrumb styleClass="ui-breadcrumb p-mb-3"
				style="border: none; background: transparent; padding-left: 0;">
				<p:menuitem value="Inicio"
					outcome="/paginas/index?faces-redirect=true" icon="pi pi-home" />
				<p:menuitem value="Contabilidad" url="#" />
				<p:menuitem value="Registrar Egresos" url="#" />
			</p:breadCrumb>
			<!-- ── PAGE-HEADER ──────────────────────────────────────────── -->
			<div class="page-header">
				<div class="page-header-left">
					<div class="page-header-icon icon-bg-primary">
						<i class="pi pi-arrow-up"></i>
					</div>
					<div>
						<h2>Administración de Egresos</h2>
						<span class="page-header-subtitle">Gestión y control de
							egresos</span>
					</div>
				</div>
				<div class="page-actions">
					<p:commandButton value="#{botones['nuevoRegistro']}"
						action="#{backingEgresos.nuevoRegistroEgreso()}"
						styleClass="ui-button-success" process="@this"
						update="registroEgresos" icon="pi pi-file" />

					<p:menuButton value="Más acciones" icon="pi pi-ellipsis-v">
						<p:menuitem value="#{botones['cargarregistrodatos']}"
							action="#{backingEgresos.dialogoBuscaEgresos}"
							icon="pi pi-upload" process="@this" update="busqueda" />
					</p:menuButton>
				</div>
			</div>

			<div class="ui-fluid p-formgrid p-grid">


				<div class="p-field p-col-12 p-md-12">
					<p:outputPanel id="listaEgresosRegistrados">
						<p:dataTable var="egreso" id="tblegresos" reflow="true"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {Exporters}"
							paginator="true" rows="10" lazy="false"
							value="#{backingEgresos.beanEgresos.listaEgresosRegistrados}">
							<f:facet name="{Exporters}">
								<div style="float: right; padding-top: 5px;">
									<h:commandLink immediate="true">
										<h:graphicImage library="img" name="excel.png"
											alt="Exportar a Excel" />
										<p:dataExporter type="xls" target="tblegresos"
											fileName="egresos" />
									</h:commandLink>

								</div>
							</f:facet>
							<p:column headerText="#{etiquetas['proveedor']}">
								<p:outputLabel value="#{egreso.proveedor.provNombre}" />
							</p:column>
							<p:column headerText="#{etiquetas['egreso']}">
								<p:outputLabel value="#{egreso.catalogo.cataDescripcion}" />
							</p:column>
							<p:column headerText="#{etiquetas['detalleEgreso']}">
								<p:outputLabel value="#{egreso.egreDetalle}" />
							</p:column>
							<p:column headerText="#{etiquetas['valor']}" width="80">
								<p:outputLabel value="#{egreso.egreValor}" />
							</p:column>
							<p:column headerText="#{etiquetas['fecha']}" width="100">
								<p:outputLabel value="#{egreso.egreFecha}" id="tblfechaegr">
									<f:convertDateTime for="tblfechaegr" pattern="yyyy-MM-dd" />
								</p:outputLabel>
							</p:column>
							<p:column headerText="Acciones" width="80"
								style="text-align:center">
								<p:commandButton icon="pi pi-percentage"
									title="Emitir Retención"
									actionListener="#{backingRetencion.prepararNuevaRetencion(egreso)}"
									process="@this" update=":formRetenciones:dlgNuevaRetencion"
									styleClass="ui-button-help rounded-button" />
							</p:column>
							<f:facet name="footer">
								<span class="p-text-bold" style="text-align: right">Total
									egresos:
									#{backingEgresos.beanEgresos.listaEgresosRegistrados.stream().map(c->c.egreValor).sum()}</span>
							</f:facet>
						</p:dataTable>
					</p:outputPanel>
				</div>
			</div>
		</h:form>

		<h:form id="formRetenciones">
			<p:growl id="growl" life="3000" showDetail="true" />
			<ui:include
				src="/paginas/contabilidad/fragmentos/dialogoRetencion.xhtml" />
		</h:form>

	</ui:define>
</ui:composition>

</html>
