<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:comp="jakarta.faces.composite/componentes" 
	xmlns:val="jakarta.faces.composite/componentes"
      xmlns:p="http://primefaces.org/ui">

	<!-- 
		Replace path to template, title, header and body
		with actual data.
	 -->
	<ui:composition template="/WEB-INF/templates/templateprincipal.xhtml">		
		<ui:define name="contenido">
		<script>
		   function exportChartInPDF() {
		      var docDefinition = {
		         content: [
		        	 'Gráfica de Egresos',
					   {
					      image: $(PF('graficaE').exportAsImage()).attr('src'),
					      width: 350
					   },    
					   'Gráfica de Ingresos',
					   {
					      image: $(PF('graficaI').exportAsImage()).attr('src'),
					      width: 350
					   },  
			   'Gráfica Ingresos/Egresos',
			   {
			      image: $(PF('graficopastel').exportAsImage()).attr('src'),
			      width: 200			      
			   }		
			 ]
		      }
		      //pdfMake.createPdf(docDefinition).open();
		      pdfMake.createPdf(docDefinition).download('graficasIngresosEgresos.pdf');
		   }
		</script>
			<f:event listener="#{backingLogin.validarSesion()}" type="preRenderView" />
			<h:form>							
				<p:growl id="growl" life="3000" showDetail="true" />

				<p:dialog widgetVar="dlgReporteFechas" modal="true" closable="true" header="#{titulos['buscaEgresosIngresos']}" responsive="true" width="420">
					<p:outputPanel id="fechas">
						<div class="ui-fluid p-formgrid p-grid" style="padding: 0.5rem 0;">
							<div class="p-field p-col-12 p-md-12" style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['fechaInicio']}:" for="fechaUno" style="display: block; font-weight: 600; margin-bottom: 0.35rem;"/>
								<p:datePicker locale="es_ES" pattern="yyyy-MM-dd" monthNavigator="true" 
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									yearNavigator="true" id="fechaUno" value="#{backingReporteria.beanReporteria.fechaInicial}" showIcon="true" style="width: 100%;" />
								<p:message for="fechaUno"/>
							</div>
							<div class="p-field p-col-12 p-md-12" style="margin-bottom: 0.85rem;">
								<p:outputLabel value="#{etiquetas['fechaFin']}:" for="fechaDos" style="display: block; font-weight: 600; margin-bottom: 0.35rem;"/>
								<p:datePicker locale="es_ES" pattern="yyyy-MM-dd"  monthNavigator="true" yearNavigator="true" 
									required="true" requiredMessage="#{mensajes['campoRequerido']}"
									id="fechaDos" value="#{backingReporteria.beanReporteria.fechaFinal}" showIcon="true" style="width: 100%;" />
								<p:message for="fechaDos"/>
							</div>
							<div style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; width: 100%;">
								<p:commandButton process="@this fechas" value="#{botones['aceptar']}" partialSubmit="true" icon="#{botones['icono.select']}"
									onstart="PF('dlgEnProc').show()" oncomplete="PF('dlgEnProc').hide()"
									update="graficas growl fechas" actionListener="#{backingReporteria.buscaReporteFlujoFechas()}"/>
								<p:commandButton icon="#{botones['icono.cancelar']}" value="#{botones['cancelar']}" process="@this" oncomplete="PF('dlgReporteFechas').hide()"/>			
							</div>
						</div>
					</p:outputPanel>
				</p:dialog>
			<p:breadCrumb styleClass="ui-breadcrumb p-mb-3" style="border: none; background: transparent; padding-left: 0;">
				<p:menuitem value="Inicio" outcome="/paginas/index?faces-redirect=true" icon="pi pi-home" />
				<p:menuitem value="Contabilidad" url="#" />
				<p:menuitem value="Reporte Ingresos/Egresos" url="#" />
			</p:breadCrumb>	
			<!-- ── PAGE-HEADER ──────────────────────────────────────────── -->
			<div class="page-header">
				<div class="page-header-left">
					<div class="page-header-icon icon-bg-primary">
						<i class="pi pi-chart-bar"></i>
					</div>
					<div>
						<h2>Administración de Estadísticas</h2>
						<span class="page-header-subtitle">Gestión de estadísticas de ingresos / egresos</span>
					</div>
				</div>
				<div class="page-actions">
					<p:commandButton value="#{botones['estadisticas']}" action="#{backingReporteria.dialogoReporteFechas}" update="fechas"
						process="@this"
						icon="pi pi-chart-line" styleClass="ui-button-success" />

					<p:menuButton value="Más acciones" icon="pi pi-ellipsis-v">
						<p:menuitem onclick="exportChartInPDF()" value="#{botones['descargarGraficas']}"  icon="pi pi-cloud-download" />
					</p:menuButton>
				</div>
			</div>
				<p:outputPanel id="graficas">
					<div class="text-center">
					<p:outputLabel value="#{titulos['resumenIngresoEgreso']} #{beanReporteria.fechasReporte}"/>
					</div>
					<div class="ui-fluid p-formgrid p-grid">
						<div class="p-field p-col-12 p-md-6">
							<p:barChart model="#{backingReporteria.beanReporteria.modelGraficoE}" id="graficaE" widgetVar="graficaE"
						style="width: 100%; height: 500px;" />	
						</div>
						<div class="p-field p-col-12 p-md-6">
							<p:barChart model="#{backingReporteria.beanReporteria.modelGraficoI}" id="graficaI" widgetVar="graficaI"
						style="width: 100%; height: 500px;" />
						</div>
						<div class="p-field p-col-12 p-md-6">
							<p:outputLabel value="#{etiquetas['ingresosEgresos']} "/>
							<p:pieChart model="#{backingReporteria.beanReporteria.modelPieFechas}"  style="width: 20%; height: 20%;" widgetVar="graficopastel"/>
						</div>
						<div class="p-field p-col-12 p-md-6">
						</div>
						<div class="p-field p-col-12 p-md-12">
							
						</div>
					</div>
					
				</p:outputPanel>	
				
			</h:form>
		</ui:define>
	</ui:composition>
</html>
