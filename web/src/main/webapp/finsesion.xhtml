<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <link rel="stylesheet" type="text/css" href="#{request.contextPath}/resources/css/custom.css" />
</h:head>
<h:body class="login-page-body">
    <div class="container-modern">
        <div class="login-card-modern" style="text-align: center;">
            <div class="status-icon-circle status-icon-danger">
                <i class="pi pi-clock"></i>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <h2 class="status-title">Sesión Expirada</h2>
                <p class="status-description">
                    Su tiempo de actividad ha caducado por seguridad. Para continuar, inicie sesión nuevamente.
                </p>
            </div>
            <h:form>
                <h:commandButton value="Volver a iniciar sesión" action="login"
                                 styleClass="status-btn-primary" />
            </h:form>
            <div class="status-footer">
                <i class="pi pi-shield"></i>
                <span>Su información está protegida</span>
            </div>
        </div>
    </div>
</h:body>
</html>
