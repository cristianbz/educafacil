<script>
    (function () {
        var mq = window.matchMedia("(max-width: 991.98px)");
        function syncLayoutForViewport() {
            var sidebar = document.getElementById("sidebar");
            var backdrop = document.getElementById("sidebar-backdrop");
            if (!mq.matches &amp;&amp; sidebar) {
                sidebar.classList.remove("mobile-open");
                if (backdrop) backdrop.classList.remove("active");
                document.body.classList.remove("sidebar-mobile-open");
            }
        }
        window.toggleSidebar = function () {
            var sidebar = document.getElementById("sidebar");
            var content = document.getElementById("content");
            var backdrop = document.getElementById("sidebar-backdrop");
            if (!sidebar || !content) return;
            if (mq.matches) {
                var open = sidebar.classList.toggle("mobile-open");
                if (backdrop) backdrop.classList.toggle("active", open);
                document.body.classList.toggle("sidebar-mobile-open", open);
                var btn = document.getElementById("sidebar-toggle-btn");
                if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
            } else {
                sidebar.classList.toggle("collapsed");
                content.classList.toggle("expanded");
            }
        };
        window.closeSidebarMobile = function () {
            if (!mq.matches) return;
            var sidebar = document.getElementById("sidebar");
            var backdrop = document.getElementById("sidebar-backdrop");
            if (sidebar) sidebar.classList.remove("mobile-open");
            if (backdrop) backdrop.classList.remove("active");
            document.body.classList.remove("sidebar-mobile-open");
            var btn = document.getElementById("sidebar-toggle-btn");
            if (btn) btn.setAttribute("aria-expanded", "false");
        };
        if (mq.addEventListener) mq.addEventListener("change", syncLayoutForViewport);
        else if (mq.addListener) mq.addListener(syncLayoutForViewport);
    })();
</script>

<!-- 1. CAMBIO: Cambiar <body> por <h:body> -->
<h:body>
	<h:form id="logoutForm">
		<p:dialog widgetVar="dlgCerrar" appendTo="@parent"
			header="#{titulos['salirSistema']}" modal="true" width="200px;"
			closable="false">
			<h:panelGrid columns="2">
				<p:commandButton value="#{botones['aceptar']}"
					icon="#{botones['icono.select']}" process="@this"
					partialSubmit="true" action="#{backingLogin.cerrarSesion()}"
					oncomplete="PF('dlgCerrar').hide();" />
				<p:commandButton value="#{botones['cancelar']}"
					icon="#{botones['icono.cancelar']}" process="@this"
					partialSubmit="true" oncomplete="PF('dlgCerrar').hide();" />
			</h:panelGrid>
		</p:dialog>
    </h:form>

    <!-- 2. CAMBIO (REUBICACIÓN): El diálogo de carga ahora se procesa PRIMERO -->
    <!-- Además, le añadimos appendTo="@(body)" para independizarlo por completo -->
    <h:form id="cargaForm">
        <p:dialog widgetVar="dlgCargando" header="#{titulos['espere']}"
                  draggable="false" modal="true" appendTo="@(body)"
                  resizable="false" closable="false" responsive="true"
                  style="font-size: var(--text-xs);">
            <div class="flex-center" style="flex-direction: column; gap: 1rem; padding: 1rem;">
                <h:graphicImage value="/resources/img/cargando.gif" width="200" height="200" alt="" />
                <span style="font-weight: 600; color: var(--text-muted); font-size: var(--text-sm);">
                    #{titulos['procesando']}
                </span>
            </div>
        </p:dialog>
    </h:form>

    <!-- 3. REUBICACIÓN: El diálogo de confirmación global también va arriba -->
    <h:form id="confirmForm">
        <p:confirmDialog widgetVar="dlgConfirmar" global="true"
                         message="#{mensajes['confirmacion.eliminar']}"
                         header="#{titulos['confirmar']}"
                         confirmLabel="#{botones['si']}"
                         cancelLabel="#{botones['no']}"
                         icon="pi pi-exclamation-triangle"
                         styleClass="shadow-lg"
                         responsive="true">
            <p:commandButton value="#{botones['si']}" type="button"
                             styleClass="ui-button-danger"
                             onclick="PF('dlgConfirmar').hide();" />
            <p:commandButton value="#{botones['no']}" type="button"
                             onclick="PF('dlgConfirmar').hide();" />
        </p:confirmDialog>
    </h:form>

    <!-- 🔵 TOP BAR (Igual) -->
    <div class="topbar">
        <button type="button" class="toggle-btn" onclick="toggleSidebar()"
            aria-label="Abrir o cerrar menú de navegación" aria-expanded="false" id="sidebar-toggle-btn">
            <i class="pi pi-bars"></i>
        </button>

        <div class="user-info">
            <i class="pi pi-user"></i>
            #{backingLogin.beanLogin.usuario.persona.persApellidos}
            #{backingLogin.beanLogin.usuario.persona.persNombres}
        </div>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop" role="presentation" onclick="closeSidebarMobile();"
        aria-hidden="true"></div>

    <!-- 🔵 SIDEBAR (Igual) -->
    <div id="sidebar" class="sidebar">
        <p:panelMenu model="#{backingLogin.menumodel}" style="width:100%" />

        <div class="logout-container">
            <h:form>
                <p:commandButton 
                    value="Cerrar sesión"
                    icon="pi pi-sign-out"
                    styleClass="ui-button-danger w-100"
                    oncomplete="PF('dlgCerrar').show();"
                    process="@this"/>
           </h:form>     
        </div>
    </div>

    <!-- 🟢 CONTENT (Ahora abajo, garantizando que todo lo anterior ya exista) -->
    <div id="content" class="content">
        <ui:insert name="contenido">
            Contenido por defecto...
        </ui:insert>
    </div>

    <script type="text/javascript">
    //<![CDATA[
        function showLoading() { if (window.PF && PF('dlgCargando')) PF('dlgCargando').show(); }
        function hideLoading() { if (window.PF && PF('dlgCargando')) PF('dlgCargando').hide(); }
        
        function initMenuIcons() {
            if (!window.jQuery) return;

            // ── 1. Iconos e tooltips en los encabezados principales (panelMenu) ──
            var panels = jQuery('[class*="menu-icon_"]');
            panels.each(function() {
                var panelEl = jQuery(this);
                var iconClass = '';
                var classes = this.className.split(/\s+/);
                for (var i = 0; i < classes.length; i++) {
                    if (classes[i].indexOf('menu-icon_') === 0) {
                        iconClass = classes[i].replace('menu-icon_', '').replace(/_/g, ' ');
                        break;
                    }
                }
                if (!iconClass) return;

                var header = panelEl.find('.ui-panelmenu-header');
                if (!header.length) return;

                // Inyectar icono si aún no existe
                if (!header.find('.menu-icon-injected').length) {
                    header.append('<span class="menu-icon-injected ' + iconClass + '"></span>');
                }

                // Leer el texto del label y ponerlo como title nativo del navegador
                var labelText = header.find('a').text().trim();
                if (labelText) {
                    header.attr('title', labelText);
                    header.find('.menu-icon-injected').attr('title', labelText);
                }
            });

            // ── 2. title nativo en los items hijo (menuitem links) ──
            jQuery('.sidebar .ui-menuitem-link').each(function() {
                var link = jQuery(this);
                if (!link.attr('title')) {
                    var text = link.find('.ui-menuitem-text').text().trim();
                    if (text) {
                        link.attr('title', text);
                    }
                }
            });
        }
        
        (function() {
            var attempts = 0;
            function tryInit() {
                if (window.jQuery) {
                    jQuery(document).ready(function() {
                        setTimeout(initMenuIcons, 300);
                    });
                    jQuery(document).on('pfAjaxComplete', initMenuIcons);
                } else if (attempts < 100) {
                    attempts++;
                    setTimeout(tryInit, 50);
                }
            }
            tryInit();
        })();
    //]]>
    </script>
