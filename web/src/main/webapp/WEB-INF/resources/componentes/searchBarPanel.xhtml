<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:composite="jakarta.faces.composite">

<composite:interface>
    <!-- Valor del campo de búsqueda (binding) -->
    <composite:attribute name="value" required="true" />
    <!-- Placeholder del campo de búsqueda -->
    <composite:attribute name="placeholder" required="false" default="Buscar..." />
    <!-- MethodExpression para la acción de búsqueda -->
    <composite:attribute name="action" required="false"
                         method-signature="void action()" />
    <!-- Id del componente a actualizar tras la búsqueda -->
    <composite:attribute name="update" required="false" default="@form" />
    <!-- Clase CSS adicional -->
    <composite:attribute name="styleClass" required="false" default="" />
</composite:interface>

<composite:implementation>
    <div class="search-bar #{cc.attrs.styleClass}">
        <span class="ui-float-label" style="flex: 1; min-width: 200px; position: relative;">
            <i class="pi pi-search search-icon"></i>
            <p:inputText id="searchInput"
                         value="#{cc.attrs.value}"
                         placeholder="#{cc.attrs.placeholder}"
                         styleClass="search-input-custom" />
        </span>
        <ui:fragment rendered="#{not empty cc.attrs.action}">
            <p:commandButton value="Buscar"
                             icon="pi pi-search"
                             action="#{cc.attrs.action}"
                             update="#{cc.attrs.update}"
                             process="@this searchInput"
                             styleClass="ui-button-primary" />
        </ui:fragment>
        <ui:insert name="searchActions" />
    </div>
</composite:implementation>
</html>
