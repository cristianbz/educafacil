# ============================================================
# Mensajes de Bean Validation (Jakarta Validation)
# ============================================================
# Formato: {clave}=mensaje
# Las claves se referencian desde las anotaciones @NotBlank, @Email, etc.
# ============================================================

# --- AuthDto ---
auth.username.required=El nombre de usuario es obligatorio.
auth.password.required=La contrase\u00f1a es obligatoria.

# --- Persona ---
persona.nombres.required=El nombre es obligatorio.
persona.nombres.size=El nombre debe tener entre {min} y {max} caracteres.
persona.apellidos.required=Los apellidos son obligatorios.
persona.apellidos.size=Los apellidos deben tener entre {min} y {max} caracteres.
persona.documentoIdentidad.required=El n\u00famero de documento es obligatorio.
persona.documentoIdentidad.size=El n\u00famero de documento debe tener entre {min} y {max} caracteres.
persona.correoElectronico.email=El correo electr\u00f3nico no es v\u00e1lido.

# --- Cliente ---
cliente.tipoIdentificacion.required=El tipo de identificaci\u00f3n es obligatorio.
cliente.numeroIdentificacion.required=El n\u00famero de identificaci\u00f3n es obligatorio.
cliente.nombresCompletos.required=El nombre completo del cliente es obligatorio.
cliente.correo.required=El correo del cliente es obligatorio.
cliente.correo.email=El correo del cliente no es v\u00e1lido.
cliente.telefono.required=El tel\u00e9fono del cliente es obligatorio.
cliente.direccion.required=La direcci\u00f3n del cliente es obligatoria.

# --- Usuario ---
usuario.usuario.required=El nombre de usuario es obligatorio.
usuario.usuario.size=El nombre de usuario debe tener entre {min} y {max} caracteres.
usuario.clave.required=La contrase\u00f1a es obligatoria.
usuario.clave.size=La contrase\u00f1a debe tener al menos {min} caracteres.

# --- Curso ---
curso.nombre.required=El nombre del curso es obligatorio.
curso.nombre.size=El nombre del curso debe tener entre {min} y {max} caracteres.

# --- Factura ---
factura.cliente.required=El cliente de la factura es obligatorio.
factura.puntoEmision.required=El punto de emisi\u00f3n es obligatorio.
factura.numero.required=El n\u00famero de factura es obligatorio.
factura.fechaEmision.required=La fecha de emisi\u00f3n es obligatoria.
factura.subtotal.required=El subtotal es obligatorio.
factura.descuentoTotal.required=El descuento total es obligatorio.
factura.totalImpuestos.required=El total de impuestos es obligatorio.
factura.total.required=El total de la factura es obligatorio.

# --- Matr\u00edcula ---
matricula.estado.required=El estado de la matr\u00edcula es obligatorio.
matricula.estudiante.required=El estudiante de la matr\u00edcula es obligatorio.

# --- Detalle de Factura ---
detalleFactura.item.required=El \u00edtem del detalle es obligatorio.
detalleFactura.factura.required=La factura del detalle es obligatoria.
detalleFactura.descripcion.required=La descripci\u00f3n del detalle es obligatoria.
detalleFactura.cantidad.required=La cantidad del detalle es obligatoria.
detalleFactura.precioUnitario.required=El precio unitario del detalle es obligatorio.

# --- Documento Electr\u00f3nico ---
documentoElectronico.factura.required=La factura del documento electr\u00f3nico es obligatoria.
